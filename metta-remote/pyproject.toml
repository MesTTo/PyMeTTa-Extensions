# Purpose: distribute the remote door registrations independently of the core.
# Guarantees: discovery loads only metadata; each body imports when called.
[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "metta-remote"
version = "0.9.3"
description = "The remote accessor for MeTTa spaces"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pymetta==0.9.3"]

[project.entry-points."metta.extensions"]
metta-remote = "metta_remote"

[tool.setuptools]
py-modules = ["metta_remote"]
