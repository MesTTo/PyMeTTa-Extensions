# Purpose: package metta-benchmarking, one distribution for one library.
# Assumes: pymetta of the same version is installed; this is a workspace member
#   released with it and pinned to it exactly.
# Guarantees: importing metta_benchmarking registers this package's rows, and so does the
#   `metta.extensions` entry point below when a dispatch discovers it.
# Decides: the dependency set is this library and nothing else, which is what
#   makes "the core names no library" hold without an allowlist.
[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "metta-benchmarking"
version = "0.8.0"
description = "Benchmark plumbing for MeTTa: counter baselines, instruction pins, slopes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    #: pymetta of exactly this version. A member is released with the core and
    #: reads its seam, so a floating pin would let a row meet a seam that no
    #: longer declares its point.
    "pymetta==0.8.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
]

#: No `metta.extensions` entry point: this package registers no row. It
#: measures a workload from outside and a caller imports it by name.
[tool.setuptools]
py-modules = ["metta_benchmarking"]
