# Purpose: distribute the live door registrations independently of the core.
# Guarantees: discovery loads only metadata; each body imports when called.
[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "metta-live"
version = "0.9.2"
description = "The live accessor for MeTTa spaces"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pymetta==0.9.2"]

[project.entry-points."metta.extensions"]
metta-live = "metta_live"

[tool.setuptools]
py-modules = ["metta_live"]
