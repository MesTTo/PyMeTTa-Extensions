[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pymetta-host"
version = "0.9.1"
description = "The patched SWI-Prolog host PyMeTTa's engine runs on, bundled"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-2-Clause"
authors = [{ name = "MesTTo", email = "a.mesto@student.unsw.edu.au" }]
keywords = ["metta", "swi-prolog", "prolog"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/MesTTo/MeTTa"

[tool.setuptools]
# The whole SWI home and the vendored bridge travel as package data: SWI
# resolves its boot files and library tree at run time, so shipping the
# Python and leaving the home behind ships nothing that runs.
include-package-data = true

[tool.setuptools.packages.find]
include = ["pymetta_host*"]

[tool.setuptools.package-data]
pymetta_host = ["swipl/**/*", "_vendor/**/*"]
